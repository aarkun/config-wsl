name: Test WSL configuration
run-name: Testing WSL configuration for Debian 13
on: [push]
jobs:
  checkout_code:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Greetings
        run: echo "Moin"
      - name: Print WD
        run: pwd
      - name: List files on Host
        run: ls -l .
      - name: Some stuff in WSL Debian-13
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Debian-13
      - shell: wsl-bash {0}
        run: id
      - name: List files in WSL
        shell: wsl-bash {0}
        run: ls -l .

