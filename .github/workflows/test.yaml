name: Test WSL configuration
on: [push]
jobs:
  test_in_linux:
    name: Test in native Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        name: Checkout repository
      - run: |
            ./bin/config_debian.sh || \
            (if [ $? -eq 2 ]; \
            then echo Should fail with \'Permission denied\'; \
            else echo Should not fail with unexpected error code; \
            fi)
        name: Call configure script as non-root

  test_in_wsl:
    name: Test in WSL
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        name: Checkout repository
      - run: id
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Debian-13
      - shell: wsl-bash {0}
        run: id
      - shell: wsl-bash {0}
        run: cat /etc/debian_version
      - shell: wsl-bash {0}
        run: ls -l /etc/apt
      - shell: wsl-bash {0}
        run: ./bin/config_debian.sh
        name: Call configure script as root

