name: Test WSL configuration
on: [push]
jobs:
  test_in_linux:
    name: Test in native Linux
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
        name: Checkout repository
      - run: |
            ./bin/config_debian.sh || \
            (if [ $? -eq 2 ]; \
            then echo Should fail with \'Permission denied\'; \
            else echo Should not fail with unexpected error code; \
            exit 1; \
            fi)
        name: Configure Debian as non-root
      - run: |
            sudo ./bin/config_user.sh || \
            (if [ $? -eq 1 ]; \
            then echo Should fail with \'You should not be root\'; \
            else echo Should not fail with unexpected error code; \
            exit 1; \
            fi)
        name: Configure user as root

  test_deb_12_in_wsl:
    name: Test Debian 12 in WSL
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        name: Checkout repository
      - run: id
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Debian-12
      - shell: wsl-bash {0}
        run: cat /etc/debian_version
      - shell: wsl-bash {0}
        run: ./bin/config_debian.sh
        name: Configure Debian as root
      - shell: wsl-bash {0}
        run: cat /etc/debian_version

  test_deb_13_in_wsl:
    name: Test Debian 13 in WSL
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        name: Checkout repository
      - run: id
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Debian-13
      - shell: wsl-bash {0}
        run: cat /etc/debian_version
      - shell: wsl-bash {0}
        run: ./bin/config_debian.sh
        name:  Configure Debian as root
      - shell: wsl-bash {0}
        run: cat /etc/debian_version
