name: Test WSL configuration
run-name: Test WSL configuration for Debian 13
on: [push]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - run: id

      - name: Configure Debian as non-root
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Debian-13
          wsl-shell-user: test
          additional-packages:
            file
      - shell: wsl-bash {0}
        run: file ./bin/config_debian.sh

