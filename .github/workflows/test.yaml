name: Test WSL configuration
on: [push]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - run: id

      - name: Configure Debian as non-root
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Debian-13
          wsl-shell-user: test
          additional-packages:
            file
      - shell: wsl-bash {0}
        run: file ./bin/config_debian.sh
      - shell: wsl-bash {0}
        run: cat ./bin/config_debian.sh

