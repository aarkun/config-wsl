name: Test WSL configuration
run-name: Testing WSL configuration for Debian 13
on: [push]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Some stuff in WSL Debian-13
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Debian-13
          wsl-shell-user: test
      - shell: wsl-bash {0}
        run: id
      - name: Print WD in WSL
        shell: wsl-bash {0}
        run: pwd
      - name: List files in WSL
        shell: wsl-bash {0}
        run: ls -l .

